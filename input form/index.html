<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <h1>Feedback Form</h1>

    <p>
        We'd love to hear your thoughts. Your feedback helps us improve our services.
    </p>

    <form>

        <div class="input-box">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" required>
        </div>

        <div class="input-box">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-box">
            <label>Rate Your Experience</label>

            <select required>
                <option value="">Select Rating</option>
                <option>⭐⭐⭐⭐⭐ Excellent</option>
                <option>⭐⭐⭐⭐ Very Good</option>
                <option>⭐⭐⭐ Good</option>
                <option>⭐⭐ Fair</option>
                <option>⭐ Poor</option>
            </select>
        </div>

        <div class="input-box">
            <label>Your Feedback</label>

            <textarea rows="5" placeholder="Write your feedback here..." required></textarea>
        </div>

        <button type="submit">
            Submit Feedback
        </button>

    </form>

</div>

</body>
</html>
